name: Sadab lint cleanup
on:
  push:
    branches: [feature/sadab-custom-suite]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true
      - name: Fix diagnostics
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/components/canvas/canvas.dart'); s=p.read_text(); s=s.replace(\"import 'package:sadab/data/tools/select.dart';\\nimport 'package:sadab/data/prefs.dart';\\n\",\"import 'package:sadab/data/prefs.dart';\\nimport 'package:sadab/data/tools/select.dart';\\n\",1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('lib/components/canvas/canvas_image.dart'); s=p.read_text(); s=s.replace(\"import 'package:sadab/components/canvas/grayscale_widget.dart';\\nimport 'package:sadab/components/canvas/grayscale_widget.dart';\\n\",\"import 'package:sadab/components/canvas/grayscale_widget.dart';\\n\",1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('lib/components/canvas/inner_canvas.dart'); s=p.read_text(); s=s.replace(\"import 'package:sadab/components/canvas/paper_grain.dart';\\nimport 'package:sadab/components/canvas/paper_grain.dart';\\n\",\"import 'package:sadab/components/canvas/paper_grain.dart';\\n\",1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('lib/components/canvas/grayscale_widget.dart'); s=p.read_text().replace('  final Widget child;','  final child;',1); p.write_text(s)"
          python3 -c "from pathlib import Path; files=['lib/components/canvas/canvas.dart','lib/components/canvas/canvas_image.dart','lib/components/canvas/inner_canvas.dart','lib/components/canvas/grayscale_widget.dart','lib/components/shapes/custom_shape_engine.dart','lib/components/shapes/shape_palette_dialog.dart','lib/components/toolbar/floating_toolbox.dart','lib/components/toolbar/toolbar_button.dart','lib/pages/editor/editor.dart']; print('\n'.join(files))"
      - name: Format and commit
        run: |
          dart format lib/components/canvas/canvas.dart lib/components/canvas/canvas_image.dart lib/components/canvas/inner_canvas.dart lib/components/canvas/grayscale_widget.dart lib/components/shapes/custom_shape_engine.dart lib/components/shapes/shape_palette_dialog.dart lib/components/toolbar/floating_toolbox.dart lib/components/toolbar/toolbar_button.dart lib/pages/editor/editor.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/components/canvas/canvas.dart lib/components/canvas/canvas_image.dart lib/components/canvas/inner_canvas.dart lib/components/canvas/grayscale_widget.dart lib/components/shapes/custom_shape_engine.dart lib/components/shapes/shape_palette_dialog.dart lib/components/toolbar/floating_toolbox.dart lib/components/toolbar/toolbar_button.dart lib/pages/editor/editor.dart .github/workflows/sadab-lint-fix.yml
          git diff --cached --quiet && exit 0
          git rm -f .github/workflows/sadab-lint-fix.yml
          git add -A
          git commit -m "fix(sadab): clean verification diagnostics"
          git push origin HEAD:feature/sadab-custom-suite
