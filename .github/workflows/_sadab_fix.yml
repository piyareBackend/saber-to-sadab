          write('lib/components/canvas/canvas.dart', r'''import 'package:flutter/material.dart';
import 'package:one_dollar_unistroke_recognizer/one_dollar_unistroke_recognizer.dart';
import 'package:onyxsdk_pen/onyxsdk_pen.dart';
import 'package:sadab/components/canvas/_stroke.dart';
import 'package:sadab/components/canvas/image/editor_image.dart';
import 'package:sadab/components/canvas/inner_canvas.dart';
import 'package:sadab/data/editor/editor_core_info.dart';
import 'package:sadab/data/editor/page.dart';
import 'package:sadab/data/tools/_tool.dart';
import 'package:sadab/data/tools/pen.dart';
import 'package:sadab/data/prefs.dart';
import 'package:sadab/data/tools/select.dart';
import 'package:sbn/tool_id.dart';

class Canvas extends StatelessWidget {
  const new({
    super.key,
    required this.path,
    required this.page,
    required this.pageIndex,
    required this.textEditing,
    required this.coreInfo,
    required this.currentStroke,
    required this.currentStrokeDetectedShape,
    required this.currentSelection,
    required this.setAsBackground,
    required this.currentTool,
    required this.currentScale,
    this.placeholder = false,
  });

  final String path;
  final EditorPage page;
  final int pageIndex;
  final bool textEditing;
  final EditorCoreInfo coreInfo;
  final Stroke? currentStroke;
  final RecognizedUnistroke? currentStrokeDetectedShape;
  final SelectResult? currentSelection;
  final void Function(EditorImage image)? setAsBackground;
  final Tool currentTool;
  final double currentScale;
  final bool placeholder;

  OnyxStrokeStyle _getOnyxTool(Tool currentTool) {
    if (placeholder) return OnyxStrokeStyle.pen;
    switch (currentTool.toolId) {
      case ToolId.fountainPen:
        return OnyxStrokeStyle.brush;
      case ToolId.ballpointPen:
        return OnyxStrokeStyle.pen;
      case ToolId.highlighter:
        return OnyxStrokeStyle.marker;
      case ToolId.pencil:
        return OnyxStrokeStyle.pencil;
      case ToolId.shapePen:
      case ToolId.eraser:
        return OnyxStrokeStyle.disabled;
      case ToolId.select:
      case ToolId.laserPointer:
        return OnyxStrokeStyle.pen;
      default:
        return OnyxStrokeStyle.disabled;
    }
  }

  Color _getOnyxColor() {
    final darkPaper = stows.sadabEInkMode.value &&
        stows.sadabPaperPreset.value == SadabPaperPreset.mutedNight;
    if (stows.sadabHighContrastInk.value) {
      return darkPaper ? Colors.white : Colors.black;
    }
    if (currentTool is Pen) return (currentTool as Pen).color;
    return darkPaper ? Colors.white : Colors.black;
  }

  double _getOnyxWidth() {
    if (currentTool is Pen) {
      final baseSize = (currentTool as Pen).options.size * currentScale;
      return (currentTool as Pen).pressureEnabled ? baseSize : baseSize * 2;
    }
    return 3;
  }

  @override
  Widget build(BuildContext context) {
    return ListenableBuilder(
      listenable: Listenable.merge([
        stows.sadabEInkMode,
        stows.sadabPaperPreset,
        stows.sadabHighContrastInk,
      ]),
      builder: (context, _) => Center(
        child: FittedBox(
          child: DecoratedBox(
            decoration: BoxDecoration(
              boxShadow: [
                BoxShadow(color: Colors.black.withValues(alpha: .1), blurRadius: 10, spreadRadius: 2),
              ],
            ),
            child: !placeholder
                ? SizedBox(
                    width: page.size.width,
                    height: page.size.height,
                    child: OnyxSdkPenArea(
                      refreshDelay: const Duration(seconds: 1),
                      strokeStyle: _getOnyxTool(currentTool),
                      strokeColor: _getOnyxColor(),
                      strokeWidth: _getOnyxWidth(),
                      child: InnerCanvas(
                        key: page.innerCanvasKey,
                        pageIndex: pageIndex,
                        redrawPageListenable: page,
                        width: page.size.width,
                        height: page.size.height,
                        textEditing: textEditing,
                        coreInfo: coreInfo,
                        currentStroke: currentStroke,
                        currentStrokeDetectedShape: currentStrokeDetectedShape,
                        currentSelection: currentSelection,
                        setAsBackground: setAsBackground,
                        currentToolIsSelect: currentTool.toolId == ToolId.select,
                        currentScale: currentScale,
                      ),
                    ),
                  )
                : SizedBox(width: page.size.width, height: page.size.height),
          ),
        ),
      ),
    );
  }
}
''')

          # 8) Muted-night contrast + reactive repaint, preserving explicit E-Ink inversion guard.
          p = root / 'lib/components/canvas/inner_canvas.dart'
          t = p.read_text()
          t = t.replace("""  @override\n  Widget build(BuildContext context) {\n    final theme = Theme.of(context);\n""", """  @override\n  Widget build(BuildContext context) {\n    return ListenableBuilder(\n      listenable: Listenable.merge([\n        stows.sadabEInkMode,\n        stows.sadabPaperPreset,\n        stows.sadabHighContrastInk,\n      ]),\n      builder: (context, _) => _buildCanvas(context),\n    );\n  }\n\n  Widget _buildCanvas(BuildContext context) {\n    final theme = Theme.of(context);\n""", 1)
          # Close the builder around the existing return at the end.
          if not t.rstrip().endswith('\n}\n'):
              raise SystemExit('inner_canvas.dart: unexpected ending')
          # The replacement above adds one method level; existing final class brace remains correct.
          p.write_text(t)

          # Ensure high-contrast ink follows paper brightness in the painter.
          p = root / 'lib/components/canvas/_canvas_painter.dart'
          t = p.read_text()
          if "sadabHighContrastInk" not in t:
              t = t.replace("import 'package:sadab/data/tools/shape_pen.dart';", "import 'package:sadab/data/tools/shape_pen.dart';\nimport 'package:sadab/data/prefs.dart';", 1)
          old = """      var color = stroke.color.withInversion(invert);\n"""
          new = """      var color = stroke.color.withInversion(invert);\n      if (stows.sadabEInkMode.value && stows.sadabHighContrastInk.value) {\n        color = stows.sadabPaperPreset.value == SadabPaperPreset.mutedNight\n            ? Colors.white\n            : Colors.black;\n      }\n"""
          if old in t:
              t = t.replace(old, new, 1)
          old = """    final color = currentStroke!.color.withInversion(invert);\n"""
          new = """    final color = stows.sadabEInkMode.value && stows.sadabHighContrastInk.value\n        ? (stows.sadabPaperPreset.value == SadabPaperPreset.mutedNight ? Colors.white : Colors.black)\n        : currentStroke!.color.withInversion(invert);\n"""
          if old in t:
              t = t.replace(old, new, 1)
          p.write_text(t)

          # 9) Remove stale package imports without touching compatibility strings.
          for p in root.rglob('*.dart'):
              text = p.read_text(errors='ignore')
              updated = text.replace('package:saber/', 'package:sadab/')
              if updated != text:
                  p.write_text(updated)

          # 10) Deterministic CI: exact requested checks plus Android debug build.
          workflow = root / '.github/workflows/tests.yml'
          wt = workflow.read_text()
          if 'assembleDebug' not in wt:
              wt = wt.replace("      - name: Check formatting\n        run: dart format lib packages scripts test --output none --set-exit-if-changed\n", "      - name: Check formatting\n        run: dart format --set-exit-if-changed .\n\n      - name: Build Android debug APK\n        working-directory: android\n        run: ./gradlew assembleDebug\n")
          workflow.write_text(wt)

          # Security guard: fail if likely hard-coded credential assignments remain in tracked source.
          tracked = []
          import subprocess
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          patterns = [r'(?i)(password|passwd|token|api[_-]?key)\s*[:=]\s*[\"\'][^\"\']{8,}[\"\']']
          for name in tracked:
              if not (name.endswith(('.dart','.yaml','.yml','.json','.xml','.gradle','.properties','.env'))):
                  continue
              text = Path(name).read_text(errors='ignore')
              for pat in patterns:
                  if re.search(pat, text):
                      # Allow explicit environment-variable access and CI secret references.
                      hits = [m.group(0) for m in re.finditer(pat, text)]
                      real = [h for h in hits if 'Platform.environment' not in h and '${{ secrets.' not in h]
                      if real:
                          raise SystemExit(f'Potential hard-coded credential pattern in {name}; review before commit')

          print('Root-fix transformations applied.')
          PY

      - name: Verify Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Test suite
        run: flutter test --coverage --no-pub --file-reporter=json:test-results.json

      - name: Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Show diff summary
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Commit verified fixes and remove fixer workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/_sadab_fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: complete Sadab CI and tablet UX integration'
          git push origin HEAD:main
