name: Sadab production root-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadab-root-fix
  cancel-in-progress: true

jobs:
  fix-verify-commit:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'fix: complete Sadab CI and tablet UX integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - name: Apply root fixes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path('.')

          def write(path, text):
              (root / path).write_text(text)
          def replace_once(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Nextcloud integration: skip without explicit CI credentials and bound network time.
          p = root / 'test/nc_upload_download_test.dart'
          t = p.read_text()
          t = t.replace("    retry: 2,\n", "")
          if "timeout(const Duration(seconds: 45))" not in t:
              t = t.replace("    },\n    skip: hasIntegrationConfig", "    }.timeout(const Duration(seconds: 45)),\n    skip: hasIntegrationConfig", 1)
          p.write_text(t)

          # Floating toolbox: explicit Stack overlay and semantic palm-rejection state.
          p = root / 'lib/pages/editor/editor.dart'
          t = p.read_text()
          old = """  void sadabShowShapes() {\n    showDialog(\n      context: context,\n      builder: (_) => ShapePaletteDialog(\n        onSelected: (_) => setState(() => currentTool = ShapePen()),\n      ),\n    );\n  }"""
          new = """  void sadabShowShapes() {\n    showDialog(\n      context: context,\n      builder: (_) => ShapePaletteDialog(\n        onSelected: (definition) => setState(() {\n          ShapePen.selectedDefinition = definition;\n          currentTool = ShapePen(definition: definition);\n        }),\n      ),\n    );\n  }"""
          if old not in t: raise SystemExit('editor shape block not found')
          t = t.replace(old, new, 1)
          old = """        body: body,\n        floatingActionButton: FloatingToolbox(\n          onPenPreset: sadabPenPreset,\n          onEraser: () => setState(() => currentTool = Eraser()),\n          onUndo: undo,\n          onRedo: redo,\n          onPalmRejection: (v) =>\n              setState(() => stows.editorFingerDrawing.value = v),\n          onShapes: sadabShowShapes,\n        ),\n"""
          new = """        body: Stack(\n          children: [\n            Positioned.fill(child: body),\n            FloatingToolbox(\n              onPenPreset: sadabPenPreset,\n              onEraser: () => setState(() => currentTool = Eraser()),\n              onUndo: undo,\n              onRedo: redo,\n              onPalmRejection: (enabled) => setState(() {\n                stows.editorFingerDrawing.value = !enabled;\n                lastSeenPointerCount = 0;\n              }),\n              onShapes: sadabShowShapes,\n            ),\n          ],\n        ),\n"""
          if old not in t: raise SystemExit('editor toolbox block not found')
          p.write_text(t.replace(old, new, 1))

          # Draggable, bounds-safe toolbox. It is returned as Positioned and is now hosted by the editor Stack.
          write('lib/components/toolbar/floating_toolbox.dart', r'''import 'package:flutter/material.dart';

class FloatingToolbox extends StatefulWidget {
  const new({
    super.key,
    required this.onPenPreset,
    required this.onEraser,
    required this.onUndo,
    required this.onRedo,
    required this.onPalmRejection,
    required this.onShapes,
  });
  final ValueChanged<int> onPenPreset;
  final VoidCallback onEraser;
  final VoidCallback onUndo;
  final VoidCallback onRedo;
  final ValueChanged<bool> onPalmRejection;
  final VoidCallback onShapes;

  @override
  State<FloatingToolbox> createState() => _FloatingToolboxState();
}

class _FloatingToolboxState extends State<FloatingToolbox> {
  var position = const Offset(24, 180);
  var palmRejection = true;

  @override
  Widget build(BuildContext context) {
    final size = MediaQuery.sizeOf(context);
    const width = 330.0;
    const height = 72.0;
    final maxX = (size.width - width - 8).clamp(8.0, double.infinity);
    final maxY = (size.height - height - 8).clamp(8.0, double.infinity);
    final safe = Offset(position.dx.clamp(8.0, maxX), position.dy.clamp(8.0, maxY));
    if (safe != position) {
      WidgetsBinding.instance.addPostFrameCallback((_) {
        if (mounted) setState(() => position = safe);
      });
    }

    return Positioned(
      left: safe.dx,
      top: safe.dy,
      child: Material(
        elevation: 8,
        color: Theme.of(context).colorScheme.surface.withValues(alpha: .94),
        shape: const StadiumBorder(),
        child: Padding(
          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
          child: GestureDetector(
            behavior: HitTestBehavior.opaque,
            onPanUpdate: (d) => setState(() {
              position = Offset(
                (position.dx + d.delta.dx).clamp(8.0, maxX),
                (position.dy + d.delta.dy).clamp(8.0, maxY),
              );
            }),
            child: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                ...[1, 2, 3].map((i) => _b('P$i', () => widget.onPenPreset(i))),
                _b('E', widget.onEraser),
                _b('↶', widget.onUndo),
                _b('↷', widget.onRedo),
                _b('◇', widget.onShapes),
                IconButton(
                  tooltip: palmRejection ? 'Palm rejection on' : 'Palm rejection off',
                  isSelected: palmRejection,
                  onPressed: () {
                    final next = !palmRejection;
                    setState(() => palmRejection = next);
                    widget.onPalmRejection(next);
                  },
                  icon: const Icon(Icons.back_hand_outlined),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _b(String text, VoidCallback onPressed) => Padding(
    padding: const EdgeInsets.symmetric(horizontal: 2),
    child: IconButton.filledTonal(
      onPressed: onPressed,
      icon: Text(text, style: const TextStyle(fontWeight: FontWeight.w700, fontSize: 12)),
    ),
  );
}
''')

          # Shape tool state lives outside the storage/serialization model.
          p = root / 'lib/data/tools/shape_pen.dart'
          t = p.read_text()
          t = t.replace("import 'package:sadab/components/canvas/_stroke.dart';\n", "import 'package:sadab/components/canvas/_stroke.dart';\nimport 'package:sadab/components/shapes/custom_shape_engine.dart';\n", 1)
          t = t.replace("class ShapePen extends Pen {\n  new()\n", "class ShapePen extends Pen {\n  ShapePen({CustomShapeDefinition? definition})\n", 1)
          t = t.replace("        toolId: .shapePen,\n      );\n\n  static final log", "        toolId: .shapePen,\n      );\n\n  final CustomShapeDefinition definition;\n  static CustomShapeDefinition selectedDefinition = CustomShapeRegistry.defaults.first;\n  static final Map<Stroke, CustomShapeDefinition> definitionsByStroke = {};\n\n  static final log", 1)
          # The constructor initializer needs to set definition before super; replace the generated constructor line exactly.
          t = t.replace("  ShapePen({CustomShapeDefinition? definition})\n    : super(", "  ShapePen({CustomShapeDefinition? definition})\n    : definition = definition ?? selectedDefinition,\n      super(", 1)
          t = t.replace("    final rawStroke = super.onDragEnd();\n    if (rawStroke == null) return null;\n", "    final rawStroke = super.onDragEnd();\n    if (rawStroke == null) return null;\n    definitionsByStroke[rawStroke] = definition;\n", 1)
          p.write_text(t)

          # Custom shape presentation renderer: all advertised shapes + fills + line styles + weights.
          write('lib/components/shapes/custom_shape_engine.dart', r'''import 'dart:math' as math;

import 'package:flutter/material.dart';

enum ShapeKind { line, arrow, doubleArrow, rectangle, roundedRect, ellipse, axes, triangle, star }
enum ShapeFill { transparent, translucent, solid }
enum ShapeStrokeStyle { solid, dotted, dashed }

class CustomShapeDefinition {
  const new({
    required this.id,
    required this.label,
    required this.kind,
    this.fill = ShapeFill.transparent,
    this.strokeStyle = ShapeStrokeStyle.solid,
    this.lineWeight = 3,
  });
  final String id;
  final String label;
  final ShapeKind kind;
  final ShapeFill fill;
  final ShapeStrokeStyle strokeStyle;
  final double lineWeight;
}

class CustomShapeRegistry {
  static const defaults = <CustomShapeDefinition>[
    CustomShapeDefinition(id: 'line', label: 'Line', kind: ShapeKind.line),
    CustomShapeDefinition(id: 'arrow', label: 'Arrow', kind: ShapeKind.arrow),
    CustomShapeDefinition(id: 'double-arrow', label: 'Double Arrow', kind: ShapeKind.doubleArrow),
    CustomShapeDefinition(id: 'rectangle', label: 'Rectangle', kind: ShapeKind.rectangle),
    CustomShapeDefinition(id: 'rounded-rect', label: 'Rounded Rect', kind: ShapeKind.roundedRect),
    CustomShapeDefinition(id: 'ellipse', label: 'Circle / Ellipse', kind: ShapeKind.ellipse),
    CustomShapeDefinition(id: 'axes', label: 'Coordinate Axes', kind: ShapeKind.axes),
    CustomShapeDefinition(id: 'triangle', label: 'Triangle', kind: ShapeKind.triangle),
    CustomShapeDefinition(id: 'star', label: 'Star', kind: ShapeKind.star),
  ];
  final List<CustomShapeDefinition> custom = [];
  List<CustomShapeDefinition> get all => [...defaults, ...custom];
  void add(CustomShapeDefinition definition) => custom.add(definition);
}

class ShapeSnapAssist {
  static double snapAngle(double radians, {double increment = math.pi / 12}) => (radians / increment).round() * increment;
  static Rect normalizeRect(Offset a, Offset b) => Rect.fromPoints(a, b);
}
''')

          # Reactive E-Ink/paper settings and contrast-safe live stylus color.
          p = root / 'lib/components/canvas/canvas.dart'
          t = p.read_text()
          if 'ListenableBuilder(' not in t:
              t = t.replace("  @override\n  Widget build(BuildContext context) {\n    return Center(\n", "  @override\n  Widget build(BuildContext context) {\n    return ListenableBuilder(\n      listenable: Listenable.merge([stows.sadabEInkMode, stows.sadabPaperPreset, stows.sadabHighContrastInk]),\n      builder: (context, _) => Center(\n", 1)
              t = t.replace("    );\n  }\n}\n", "      ),\n    );\n  }\n}\n", 1)
          old = "    if (stows.sadabHighContrastInk.value) return Colors.black;"
          new = "    if (stows.sadabHighContrastInk.value) {\n      return darkPaper ? Colors.white : Colors.black;\n    }"
          t = t.replace(old, new, 1)
          t = t.replace("    if (currentTool is Pen) return (currentTool as Pen).color;\n    return Colors.black;", "    if (currentTool is Pen) return (currentTool as Pen).color;\n    return darkPaper ? Colors.white : Colors.black;", 1)
          p.write_text(t)

          # Inner canvas reacts immediately to the three Sadab paper controls; explicit E-Ink mode keeps auto-invert disabled.
          p = root / 'lib/components/canvas/inner_canvas.dart'
          t = p.read_text()
          if "ListenableBuilder" not in t:
              t = t.replace("  @override\n  Widget build(BuildContext context) {\n", "  @override\n  Widget build(BuildContext context) {\n    return ListenableBuilder(\n      listenable: Listenable.merge([stows.sadabEInkMode, stows.sadabPaperPreset, stows.sadabHighContrastInk]),\n      builder: (context, _) => _buildCanvas(context),\n    );\n  }\n\n  Widget _buildCanvas(BuildContext context) {\n", 1)
          p.write_text(t)

          # Make painter high-contrast ink follow the selected paper brightness.
          p = root / 'lib/components/canvas/_canvas_painter.dart'
          t = p.read_text()
          if "package:sadab/data/prefs.dart" not in t:
              t = t.replace("import 'package:sadab/data/tools/shape_pen.dart';", "import 'package:sadab/data/tools/shape_pen.dart';\nimport 'package:sadab/data/prefs.dart';", 1)
          t = t.replace("      var color = stroke.color.withInversion(invert);\n", "      var color = stroke.color.withInversion(invert);\n      if (stows.sadabEInkMode.value && stows.sadabHighContrastInk.value) {\n        color = stows.sadabPaperPreset.value == SadabPaperPreset.mutedNight ? Colors.white : Colors.black;\n      }\n", 1)
          t = t.replace("    final color = currentStroke!.color.withInversion(invert);\n", "    final color = stows.sadabEInkMode.value && stows.sadabHighContrastInk.value\n        ? (stows.sadabPaperPreset.value == SadabPaperPreset.mutedNight ? Colors.white : Colors.black)\n        : currentStroke!.color.withInversion(invert);\n", 1)
          p.write_text(t)

          # Stale package imports only; compatibility/storage strings are untouched.
          for p in root.rglob('*.dart'):
              text = p.read_text(errors='ignore')
              updated = text.replace('package:saber/', 'package:sadab/')
              if updated != text:
                  p.write_text(updated)

          # CI must execute the requested checks and the Android debug build.
          workflow = root / '.github/workflows/tests.yml'
          wt = workflow.read_text()
          if 'dart format --set-exit-if-changed .' not in wt:
              wt = wt.replace("      - name: Check formatting\n        run: dart format lib packages scripts test --output none --set-exit-if-changed", "      - name: Check formatting\n        run: dart format --set-exit-if-changed .")
          if 'name: Build Android debug APK' not in wt:
              wt += "\n      - name: Build Android debug APK\n        working-directory: android\n        run: ./gradlew assembleDebug\n"
          workflow.write_text(wt)

          # No literal credential assignments in source/config. Do not print matches.
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          patterns = [r'(?i)(password|passwd|token|api[_-]?key)\s*[:=]\s*[\"\'][^\"\']{8,}[\"\']']
          allow_names = {'test/nc_upload_download_test.dart'}
          for name in tracked:
              if name in allow_names or not name.endswith(('.dart','.yaml','.yml','.json','.xml','.gradle','.properties','.env')):
                  continue
              text = Path(name).read_text(errors='ignore')
              if any(re.search(pat, text) for pat in patterns):
                  raise SystemExit(f'Potential hard-coded credential in {name}')
          print('Root-fix transformations applied.')
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart analyze
        run: dart analyze

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Flutter tests
        run: flutter test --coverage --no-pub --file-reporter=json:test-results.json

      - name: Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit verified changes and remove fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/_sadab_fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: complete Sadab CI and tablet UX integration'
          git push origin HEAD:main
