name: Sadab production root-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

auto_cancel: true

jobs:
  fix-verify-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: run Sadab production root-fix pass'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - name: Apply root fixes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text()
          def write(path, text):
              (root / path).write_text(text)
          def replace_once(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          # 1) Isolate Nextcloud integration from the normal test gate and bound network time.
          p = root / 'test/nc_upload_download_test.dart'
          t = p.read_text()
          t = t.replace("    retry: 2,\n", "")
          t = t.replace("    () async {\n", "    () async {\n", 1)
          marker = "      const content = 'Hello, world!';\n"
          if marker in t:
              t = t.replace(marker, marker, 1)
          # Wrap the network-heavy body by applying a timeout to the complete test future.
          # Keep the test skipped when the required environment is absent.
          if "timeout(const Duration(seconds: 45))" not in t:
              t = t.replace("    },\n    skip: hasIntegrationConfig", "    }.timeout(const Duration(seconds: 45)),\n    skip: hasIntegrationConfig", 1)
          p.write_text(t)

          # 2) Floating toolbox: it is a Stack child, not Scaffold.floatingActionButton.
          p = root / 'lib/pages/editor/editor.dart'
          t = p.read_text()
          old = """  void sadabShowShapes() {\n    showDialog(\n      context: context,\n      builder: (_) => ShapePaletteDialog(\n        onSelected: (_) => setState(() => currentTool = ShapePen()),\n      ),\n    );\n  }"""
          new = """  void sadabShowShapes() {\n    showDialog(\n      context: context,\n      builder: (_) => ShapePaletteDialog(\n        onSelected: (definition) => setState(() {\n          ShapePen.selectedDefinition = definition;\n          currentTool = ShapePen(definition: definition);\n        }),\n      ),\n    );\n  }"""
          if old not in t:
              raise SystemExit('editor.dart: shape dialog block not found')
          t = t.replace(old, new, 1)
          old = """        body: body,\n        floatingActionButton: FloatingToolbox(\n          onPenPreset: sadabPenPreset,\n          onEraser: () => setState(() => currentTool = Eraser()),\n          onUndo: undo,\n          onRedo: redo,\n          onPalmRejection: (v) =>\n              setState(() => stows.editorFingerDrawing.value = v),\n          onShapes: sadabShowShapes,\n        ),\n"""
          new = """        body: Stack(\n          children: [\n            Positioned.fill(child: body),\n            FloatingToolbox(\n              onPenPreset: sadabPenPreset,\n              onEraser: () => setState(() => currentTool = Eraser()),\n              onUndo: undo,\n              onRedo: redo,\n              onPalmRejection: (enabled) => setState(() {\n                // Palm rejection ON means finger drawing OFF.\n                stows.editorFingerDrawing.value = !enabled;\n                lastSeenPointerCount = 0;\n              }),\n              onShapes: sadabShowShapes,\n            ),\n          ],\n        ),\n"""
          if old not in t:
              raise SystemExit('editor.dart: floating toolbox block not found')
          t = t.replace(old, new, 1)
          p.write_text(t)

          # 3) Draggable toolbox returns Positioned and exposes a semantically correct palm state.
          write('lib/components/toolbar/floating_toolbox.dart', r'''import 'package:flutter/material.dart';

class FloatingToolbox extends StatefulWidget {
  const new({
    super.key,
    required this.onPenPreset,
    required this.onEraser,
    required this.onUndo,
    required this.onRedo,
    required this.onPalmRejection,
    required this.onShapes,
  });

  final ValueChanged<int> onPenPreset;
  final VoidCallback onEraser;
  final VoidCallback onUndo;
  final VoidCallback onRedo;
  final ValueChanged<bool> onPalmRejection;
  final VoidCallback onShapes;

  @override
  State<FloatingToolbox> createState() => _FloatingToolboxState();
}

class _FloatingToolboxState extends State<FloatingToolbox> {
  var position = const Offset(24, 180);
  var palmRejection = true;

  void _move(Offset delta, Size size) {
    const horizontalPadding = 8.0;
    const verticalPadding = 8.0;
    const toolboxWidth = 330.0;
    const toolboxHeight = 72.0;
    final maxX = (size.width - toolboxWidth - horizontalPadding).clamp(
      horizontalPadding,
      double.infinity,
    );
    final maxY = (size.height - toolboxHeight - verticalPadding).clamp(
      verticalPadding,
      double.infinity,
    );
    setState(() {
      position = Offset(
        (position.dx + delta.dx).clamp(horizontalPadding, maxX),
        (position.dy + delta.dy).clamp(verticalPadding, maxY),
      );
    });
  }

  @override
  Widget build(BuildContext context) {
    final size = MediaQuery.sizeOf(context);
    final maxX = (size.width - 330).clamp(8.0, double.infinity);
    final maxY = (size.height - 72).clamp(8.0, double.infinity);
    final safePosition = Offset(
      position.dx.clamp(8.0, maxX),
      position.dy.clamp(8.0, maxY),
    );
    if (safePosition != position) {
      WidgetsBinding.instance.addPostFrameCallback((_) {
        if (mounted) setState(() => position = safePosition);
      });
    }

    return Positioned(
      left: safePosition.dx,
      top: safePosition.dy,
      child: Material(
        elevation: 8,
        color: Theme.of(context).colorScheme.surface.withValues(alpha: .94),
        shape: const StadiumBorder(),
        child: Padding(
          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
          child: GestureDetector(
            behavior: HitTestBehavior.opaque,
            onPanUpdate: (details) => _move(details.delta, size),
            child: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                ...[1, 2, 3].map((i) => _b('P$i', () => widget.onPenPreset(i))),
                _b('E', widget.onEraser),
                _b('↶', widget.onUndo),
                _b('↷', widget.onRedo),
                _b('◇', widget.onShapes),
                IconButton(
                  tooltip: palmRejection
                      ? 'Palm rejection on'
                      : 'Palm rejection off',
                  isSelected: palmRejection,
                  onPressed: () {
                    final next = !palmRejection;
                    setState(() => palmRejection = next);
                    widget.onPalmRejection(next);
                  },
                  icon: const Icon(Icons.back_hand_outlined),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _b(String text, VoidCallback onPressed) => Padding(
    padding: const EdgeInsets.symmetric(horizontal: 2),
    child: IconButton.filledTonal(
      onPressed: onPressed,
      icon: Text(
        text,
        style: const TextStyle(fontWeight: FontWeight.w700, fontSize: 12),
      ),
    ),
  );
}
''')

          # 4) Shape tool: carry the selected definition through the drawing layer.
          write('lib/data/tools/shape_pen.dart', r'''import 'dart:async';

import 'package:flutter/material.dart';
import 'package:font_awesome_flutter/font_awesome_flutter.dart';
import 'package:logging/logging.dart';
import 'package:one_dollar_unistroke_recognizer/one_dollar_unistroke_recognizer.dart';
import 'package:sadab/components/canvas/_circle_stroke.dart';
import 'package:sadab/components/canvas/_rectangle_stroke.dart';
import 'package:sadab/components/canvas/_stroke.dart';
import 'package:sadab/components/shapes/custom_shape_engine.dart';
import 'package:sadab/data/prefs.dart';
import 'package:sadab/data/tools/pen.dart';
import 'package:sadab/i18n/strings.g.dart';

class ShapePen extends Pen {
  ShapePen({CustomShapeDefinition? definition})
    : definition = definition ?? selectedDefinition,
      super(
        name: t.editor.pens.shapePen,
        sizeMin: 1,
        sizeMax: 25,
        sizeStep: 1,
        icon: shapePenIcon,
        options: stows.lastShapePenOptions.value,
        pressureEnabled: false,
        color: Color(stows.lastShapePenColor.value),
        toolId: .shapePen,
      );

  static final log = Logger('ShapePen');
  static const shapePenIcon = FontAwesomeIcons.shapes;
  static CustomShapeDefinition selectedDefinition = CustomShapeRegistry.defaults.first;
  static final Map<Stroke, CustomShapeDefinition> definitionsByStroke = {};

  final CustomShapeDefinition definition;

  CustomShapeDefinition definitionFor(Stroke stroke) =>
      definitionsByStroke[stroke] ?? definition;

  static RecognizedUnistroke? detectedShape;

  void _detectShape() {
    detectedShape = Pen.currentStroke?.detectShape();
  }

  static Timer? _detectShapeDebouncer;
  static var debounceDuration = getDebounceFromPref();

  static Duration getDebounceFromPref() {
    assert(stows.shapeRecognitionDelay.loaded);
    final ms = stows.shapeRecognitionDelay.value;
    return ms < 0 ? const Duration(hours: 1) : Duration(milliseconds: ms);
  }

  @override
  void onDragUpdate(Offset position, double? pressure) {
    super.onDragUpdate(position, pressure);
    final isPreviewEnabled = debounceDuration < const Duration(hours: 1);
    final isTimerActive = _detectShapeDebouncer?.isActive ?? false;
    if (isPreviewEnabled && !isTimerActive) {
      _detectShapeDebouncer = Timer(debounceDuration, _detectShape);
    }
  }

  @override
  Stroke? onDragEnd() {
    _detectShapeDebouncer?.cancel();
    _detectShapeDebouncer = null;
    _detectShape();

    final rawStroke = super.onDragEnd();
    if (rawStroke == null) return null;
    assert(rawStroke.options.isComplete == true);

    definitionsByStroke[rawStroke] = definition;

    final detectedShape = ShapePen.detectedShape;
    ShapePen.detectedShape = null;
    if (detectedShape == null) return rawStroke;

    switch (detectedShape.name) {
      case null:
        return rawStroke;
      case DefaultUnistrokeNames.line:
        return rawStroke..convertToLine();
      case DefaultUnistrokeNames.rectangle:
        final rect = detectedShape.convertToRect();
        return RectangleStroke(
          color: color,
          pressureEnabled: pressureEnabled,
          options: rawStroke.options,
          pageIndex: rawStroke.pageIndex,
          page: rawStroke.page,
          toolId: toolId,
          rect: rect,
        );
      case DefaultUnistrokeNames.circle:
        final (center, radius) = detectedShape.convertToCircle();
        return CircleStroke(
          color: color,
          pressureEnabled: pressureEnabled,
          options: rawStroke.options,
          pageIndex: rawStroke.pageIndex,
          page: rawStroke.page,
          toolId: toolId,
          radius: radius,
          center: center,
        );
      case DefaultUnistrokeNames.triangle:
      case DefaultUnistrokeNames.star:
        final polygon = detectedShape.convertToCanonicalPolygon();
        return Stroke(
          color: color,
          pressureEnabled: pressureEnabled,
          options: rawStroke.options,
          pageIndex: rawStroke.pageIndex,
          page: rawStroke.page,
          toolId: toolId,
        )..addPoints(polygon);
    }
  }
}
''')

          # 5) Full custom shape renderer. It remains presentation/tool-layer state; stroke storage is untouched.
          write('lib/components/shapes/custom_shape_engine.dart', r'''import 'dart:math' as math;

import 'package:flutter/material.dart';

import 'package:sadab/components/canvas/_stroke.dart';

enum ShapeKind {
  line,
  arrow,
  doubleArrow,
  rectangle,
  roundedRect,
  ellipse,
  axes,
  triangle,
  star,
}

enum ShapeFill { transparent, translucent, solid }

enum ShapeStrokeStyle { solid, dotted, dashed }

class CustomShapeDefinition {
  const new({
    required this.id,
    required this.label,
    required this.kind,
    this.fill = ShapeFill.transparent,
    this.strokeStyle = ShapeStrokeStyle.solid,
    this.lineWeight = 3,
  });
  final String id;
  final String label;
  final ShapeKind kind;
  final ShapeFill fill;
  final ShapeStrokeStyle strokeStyle;
  final double lineWeight;
}

class CustomShapeRegistry {
  static const defaults = <CustomShapeDefinition>[
    CustomShapeDefinition(id: 'line', label: 'Line', kind: ShapeKind.line),
    CustomShapeDefinition(id: 'arrow', label: 'Arrow', kind: ShapeKind.arrow),
    CustomShapeDefinition(id: 'double-arrow', label: 'Double Arrow', kind: ShapeKind.doubleArrow),
    CustomShapeDefinition(id: 'rectangle', label: 'Rectangle', kind: ShapeKind.rectangle),
    CustomShapeDefinition(id: 'rounded-rect', label: 'Rounded Rect', kind: ShapeKind.roundedRect),
    CustomShapeDefinition(id: 'ellipse', label: 'Circle / Ellipse', kind: ShapeKind.ellipse),
    CustomShapeDefinition(id: 'axes', label: 'Coordinate Axes', kind: ShapeKind.axes),
    CustomShapeDefinition(id: 'triangle', label: 'Triangle', kind: ShapeKind.triangle),
    CustomShapeDefinition(id: 'star', label: 'Star', kind: ShapeKind.star),
  ];

  final List<CustomShapeDefinition> custom = [];
  List<CustomShapeDefinition> get all => [...defaults, ...custom];
  void add(CustomShapeDefinition definition) => custom.add(definition);
}

class ShapeSnapAssist {
  static double snapAngle(double radians, {double increment = math.pi / 12}) =>
      (radians / increment).round() * increment;
  static Rect normalizeRect(Offset a, Offset b) => Rect.fromPoints(a, b);
}

class CustomShapeRenderer {
  static void draw(Canvas canvas, Stroke stroke, CustomShapeDefinition definition) {
    final points = stroke.lowQualityPolygon;
    if (points.length < 2) return;
    final rect = _bounds(points).inflate(stroke.options.size / 2);
    final paint = Paint()
      ..color = stroke.color
      ..style = definition.fill == ShapeFill.transparent ? PaintingStyle.stroke : PaintingStyle.fill
      ..strokeWidth = definition.lineWeight.clamp(1, 25)
      ..strokeCap = StrokeCap.round
      ..strokeJoin = StrokeJoin.round;

    if (definition.strokeStyle == ShapeStrokeStyle.dashed) {
      _drawDashed(canvas, _pathFor(definition.kind, rect), paint);
      return;
    }
    if (definition.strokeStyle == ShapeStrokeStyle.dotted) {
      _drawDotted(canvas, _pathFor(definition.kind, rect), paint);
      return;
    }
    _drawFillAndStroke(canvas, definition.kind, rect, paint);
  }

  static Rect _bounds(List<Offset> points) {
    var left = points.first.dx;
    var top = points.first.dy;
    var right = left;
    var bottom = top;
    for (final point in points.skip(1)) {
      left = math.min(left, point.dx);
      top = math.min(top, point.dy);
      right = math.max(right, point.dx);
      bottom = math.max(bottom, point.dy);
    }
    return Rect.fromLTRB(left, top, right, bottom);
  }

  static Path _pathFor(ShapeKind kind, Rect r) {
    final path = Path();
    final c = r.center;
    switch (kind) {
      case ShapeKind.line:
        path.moveTo(r.left, c.dy);
        path.lineTo(r.right, c.dy);
      case ShapeKind.arrow:
        _lineWithArrow(path, Offset(r.left, c.dy), Offset(r.right, c.dy));
      case ShapeKind.doubleArrow:
        _lineWithArrow(path, Offset(r.left, c.dy), Offset(r.right, c.dy));
        _arrowHead(path, Offset(r.right, c.dy), const Offset(-1, 0));
        _arrowHead(path, Offset(r.left, c.dy), const Offset(1, 0));
      case ShapeKind.rectangle:
        path.addRect(r);
      case ShapeKind.roundedRect:
        path.addRRect(RRect.fromRectAndRadius(r, Radius.circular(math.min(r.shortestSide * .2, 28))));
      case ShapeKind.ellipse:
        path.addOval(r);
      case ShapeKind.axes:
        path.moveTo(r.left, c.dy);
        path.lineTo(r.right, c.dy);
        path.moveTo(c.dx, r.top);
        path.lineTo(c.dx, r.bottom);
        _arrowHead(path, Offset(r.right, c.dy), const Offset(-1, 0));
        _arrowHead(path, Offset(c.dx, r.top), const Offset(0, 1));
      case ShapeKind.triangle:
        path.moveTo(c.dx, r.top);
        path.lineTo(r.right, r.bottom);
        path.lineTo(r.left, r.bottom);
        path.close();
      case ShapeKind.star:
        final radius = r.shortestSide / 2;
        for (var i = 0; i < 10; i++) {
          final angle = -math.pi / 2 + i * math.pi / 5;
          final rr = i.isEven ? radius : radius * .42;
          final point = Offset(c.dx + math.cos(angle) * rr, c.dy + math.sin(angle) * rr);
          if (i == 0) {
            path.moveTo(point.dx, point.dy);
          } else {
            path.lineTo(point.dx, point.dy);
          }
        }
        path.close();
    }
    return path;
  }

  static void _drawFillAndStroke(Canvas canvas, ShapeKind kind, Rect r, Paint paint) {
    if (paint.style == PaintingStyle.fill) {
      paint.color = paint.color.withValues(alpha: .28);
      canvas.drawPath(_pathFor(kind, r), paint);
      paint
        ..style = PaintingStyle.stroke
        ..color = paint.color.withValues(alpha: 1);
    }
    canvas.drawPath(_pathFor(kind, r), paint);
  }

  static void _drawDashed(Canvas canvas, Path path, Paint paint) {
    final metrics = path.computeMetrics();
    for (final metric in metrics) {
      for (double d = 0; d < metric.length; d += 14) {
        final end = math.min(d + 8, metric.length);
        canvas.drawPath(metric.extractPath(d, end), paint..style = PaintingStyle.stroke);
      }
    }
  }

  static void _drawDotted(Canvas canvas, Path path, Paint paint) {
    final metrics = path.computeMetrics();
    for (final metric in metrics) {
      for (double d = 0; d < metric.length; d += 10) {
        final tangent = metric.getTangentForOffset(d);
        if (tangent == null) continue;
        canvas.drawCircle(tangent.position, paint.strokeWidth / 2, paint..style = PaintingStyle.fill);
      }
    }
  }

  static void _lineWithArrow(Path path, Offset a, Offset b) {
    path.moveTo(a.dx, a.dy);
    path.lineTo(b.dx, b.dy);
    _arrowHead(path, b, Offset((a.dx - b.dx), (a.dy - b.dy)));
  }

  static void _arrowHead(Path path, Offset tip, Offset direction) {
    final length = direction.distance == 0 ? 12 : math.min(18, direction.distance * .22);
    final unit = direction / (direction.distance == 0 ? 1 : direction.distance);
    final side = Offset(-unit.dy, unit.dx);
    final base = tip + unit * length;
    path.moveTo(tip.dx, tip.dy);
    path.lineTo((base + side * length * .55).dx, (base + side * length * .55).dy);
    path.moveTo(tip.dx, tip.dy);
    path.lineTo((base - side * length * .55).dx, (base - side * length * .55).dy);
  }
}
''')

