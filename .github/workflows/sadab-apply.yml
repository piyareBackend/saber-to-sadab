name: Sadab customization
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Sadab suite
        run: |
          mkdir -p lib/components/shapes
          sed -i '/^PY$/d' .github/scripts/apply_sadab.py
          python3 - <<'PY'
from pathlib import Path
p = Path('.github/scripts/apply_sadab.py')
s = p.read_text()
if '# Compact toolbar button ergonomics.' in s and '# New, cache-friendly paper grain renderer.' in s:
    a = s.index('# Compact toolbar button ergonomics.')
    b = s.index('# New, cache-friendly paper grain renderer.')
    s = s[:a] + s[b:]
    p.write_text(s)
PY
          python3 .github/scripts/apply_sadab.py
      - name: Commit Sadab suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/sadab-apply.yml .github/scripts/apply_sadab.py || true
          git diff --cached --quiet && exit 0
          git commit -m "feat(sadab): apply study suite"
          git push origin HEAD:feature/sadab-custom-suite
