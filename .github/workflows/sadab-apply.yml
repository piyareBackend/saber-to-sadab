name: Sadab customization
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Sadab suite
        run: |
          mkdir -p lib/components/shapes
          sed -i '/^PY$/d' .github/scripts/apply_sadab.py
          sed -i '/^# Compact toolbar button ergonomics\./,/^# New, cache-friendly paper grain renderer\./{/^# New, cache-friendly paper grain renderer\./!d;}' .github/scripts/apply_sadab.py
          python3 .github/scripts/apply_sadab.py
      - name: Commit Sadab suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/sadab-apply.yml .github/scripts/apply_sadab.py || true
          git diff --cached --quiet && exit 0
          git commit -m "feat(sadab): apply study suite"
          git push origin HEAD:feature/sadab-custom-suite
