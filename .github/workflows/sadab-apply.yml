name: Sadab customization
on:
  push:
    branches: [feature/sadab-custom-suite]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'feat(sadab): apply study suite' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Sadab suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/piyareBackend/saber-to-sadab.git" || test "${GITHUB_REPOSITORY}" = "piyareBackend/saber-to-sadab"
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def edit(path, fn):
              p = root / path
              s = p.read_text()
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(n)

          def ins_once(s, marker, addition):
              if addition in s:
                  return s
              i = s.find(marker)
              if i < 0:
                  raise SystemExit(f'Marker not found: {marker}')
              return s[:i] + addition + s[i:]

          # Package/app branding. Internal storage/network identifiers are intentionally untouched.
          edit('pubspec.yaml', lambda s: s.replace('name: saber\n', 'name: sadab\n', 1).replace('description: A cross-platform libre notes app', 'description: A distraction-free study and reading app', 1))
          edit('lib/main.dart', lambda s: s.replace("title: 'Saber'", "title: 'Sadab'", 1))

          # Keep Dart package imports coherent with the new package name.
          for p in (root / 'lib').rglob('*.dart'):
              s = p.read_text()
              n = s.replace('package:saber/', 'package:sadab/')
              if n != s:
                  p.write_text(n)

          # Preferences / paper presets.
          edit('lib/data/prefs.dart', lambda s: ins_once(
              s,
              'var _isOnMainIsolate = false;\n',
              "\nenum SadabPaperPreset { warmPaper, eInkNeutral, mutedNight }\n\nColor sadabPaperColor(SadabPaperPreset preset) => switch (preset) {\n  SadabPaperPreset.warmPaper => const Color(0xFFF4ECD8),\n  SadabPaperPreset.eInkNeutral => const Color(0xFFE5E0D8),\n  SadabPaperPreset.mutedNight => const Color(0xFF1A1A1A),\n};\n"
          ).replace(
              "  final customDataDir = PlainStow<String?>(",
              "  final sadabEInkMode = PlainStow('sadabEInkMode', false, volatile: !_isOnMainIsolate);\n  final sadabHighContrastInk = PlainStow('sadabHighContrastInk', false, volatile: !_isOnMainIsolate);\n  final sadabPaperPreset = PlainStow(\n    'sadabPaperPreset', SadabPaperPreset.eInkNeutral,\n    codec: const EnumCodec(SadabPaperPreset.values), volatile: !_isOnMainIsolate,\n  );\n\n  final customDataDir = PlainStow<String?>(",
              1
          )))

          # Canvas: high-contrast ink only changes the color handed to the existing Onyx area.
          edit('lib/components/canvas/canvas.dart', lambda s: s.replace(
              "import 'package:saber/data/tools/select.dart';\n",
              "import 'package:sadab/data/tools/select.dart';\nimport 'package:sadab/data/prefs.dart';\n",
              1
          ).replace(
              "  Color _getOnyxColor() {\n    if (currentTool is Pen) {",
              "  Color _getOnyxColor() {\n    if (stows.sadabHighContrastInk.value) return Colors.black;\n    if (currentTool is Pen) {",
              1
          ).replace('package:saber/', 'package:sadab/'))

          # Paper engine: inversion guard, explicit background presets, cached grain layer.
          edit('lib/components/canvas/inner_canvas.dart', lambda s: s
              .replace("import 'package:saber/components/canvas/image/editor_image.dart';\n", "import 'package:sadab/components/canvas/image/editor_image.dart';\nimport 'package:sadab/components/canvas/paper_grain.dart';\nimport 'package:sadab/data/prefs.dart';\n", 1)
              .replace('final invert = stows.editorAutoInvert.value && brightness == .dark;', 'final invert = stows.editorAutoInvert.value && brightness == .dark && !stows.sadabEInkMode.value;', 1)
              .replace('final Color backgroundColor = widget.coreInfo.backgroundColor ?? InnerCanvas.defaultBackgroundColor;', 'final Color backgroundColor = stows.sadabEInkMode.value ? sadabPaperColor(stows.sadabPaperPreset.value) : (widget.coreInfo.backgroundColor ?? InnerCanvas.defaultBackgroundColor);', 1)
          )
          edit('lib/components/canvas/inner_canvas.dart', lambda s: s if 'const Positioned.fill(child: PaperGrain())' in s else s.replace(
              '        if (page.backgroundImage == null)\n',
              '        if (stows.sadabEInkMode.value && page.backgroundImage == null)\n          const Positioned.fill(child: PaperGrain()),\n        if (page.backgroundImage == null)\n',
              1
          ).replace('package:saber/', 'package:sadab/'))

          # Compact pill buttons while preserving existing toolbar behavior.
          edit('lib/components/toolbar/toolbar_button.dart', lambda s: s
              .replace('package:saber/', 'package:sadab/')
              .replace('return IconButton(', "return IconButton.filled(\n", 1)
              .replace('        icon: icon,', '        icon: icon,\n        style: IconButton.styleFrom(\n          minimumSize: const Size(38, 38),\n          maximumSize: const Size(42, 42),\n          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),\n          padding: const EdgeInsets.all(8),\n        ),', 1)
          )

          Path('lib/components/canvas/grayscale_widget.dart').write_text(r'''import 'package:flutter/material.dart';

/// Applies a standard luminance-preserving grayscale filter to imported media.
class GrayscaleWidget extends StatelessWidget {
  const GrayscaleWidget({super.key, required this.child});
  final Widget child;

  static const ColorFilter filter = ColorFilter.matrix(<double>[
    0.2126, 0.7152, 0.0722, 0, 0,
    0.2126, 0.7152, 0.0722, 0, 0,
    0.2126, 0.7152, 0.0722, 0, 0,
    0,      0,      0,      1, 0,
  ]);

  @override
  Widget build(BuildContext context) => ColorFiltered(colorFilter: filter, child: child);
}
''')

          Path('lib/components/canvas/paper_grain.dart').write_text(r'''import 'package:flutter/material.dart';

class PaperGrainPainter extends CustomPainter {
  const PaperGrainPainter();
  static final List<Offset> _points = List<Offset>.generate(420, (i) {
    final x = ((i * 73) % 997) / 997.0;
    final y = ((i * 181 + 31) % 991) / 991.0;
    return Offset(x, y);
  }, growable: false);

  @override
  void paint(Canvas canvas, Size size) {
    final paint = Paint()..color = Colors.black.withValues(alpha: 0.022);
    for (final point in _points) {
      canvas.drawCircle(Offset(point.dx * size.width, point.dy * size.height), 0.45, paint);
    }
  }

  @override
  bool shouldRepaint(covariant PaperGrainPainter oldDelegate) => false;
}

class PaperGrain extends StatelessWidget {
  const PaperGrain({super.key});
  @override
  Widget build(BuildContext context) => const IgnorePointer(child: RepaintBoundary(child: CustomPaint(painter: PaperGrainPainter())));
}
''')

          Path('lib/components/shapes/custom_shape_engine.dart').write_text(r'''import 'dart:math' as math;
import 'package:flutter/material.dart';

enum ShapeKind { line, arrow, doubleArrow, rectangle, roundedRect, ellipse, axes, triangle, star }
enum ShapeFill { transparent, translucent, solid }
enum ShapeStrokeStyle { solid, dotted, dashed }

class CustomShapeDefinition {
  const CustomShapeDefinition({required this.id, required this.label, required this.kind, this.fill = ShapeFill.transparent, this.strokeStyle = ShapeStrokeStyle.solid, this.lineWeight = 3});
  final String id;
  final String label;
  final ShapeKind kind;
  final ShapeFill fill;
  final ShapeStrokeStyle strokeStyle;
  final double lineWeight;
}

class CustomShapeRegistry {
  static const defaults = <CustomShapeDefinition>[
    CustomShapeDefinition(id: 'line', label: 'Line', kind: ShapeKind.line),
    CustomShapeDefinition(id: 'arrow', label: 'Arrow', kind: ShapeKind.arrow),
    CustomShapeDefinition(id: 'double-arrow', label: 'Double Arrow', kind: ShapeKind.doubleArrow),
    CustomShapeDefinition(id: 'rectangle', label: 'Rectangle', kind: ShapeKind.rectangle),
    CustomShapeDefinition(id: 'rounded-rect', label: 'Rounded Rect', kind: ShapeKind.roundedRect),
    CustomShapeDefinition(id: 'ellipse', label: 'Circle / Ellipse', kind: ShapeKind.ellipse),
    CustomShapeDefinition(id: 'axes', label: 'Coordinate Axes', kind: ShapeKind.axes),
    CustomShapeDefinition(id: 'triangle', label: 'Triangle', kind: ShapeKind.triangle),
    CustomShapeDefinition(id: 'star', label: 'Star', kind: ShapeKind.star),
  ];
  final List<CustomShapeDefinition> custom = [];
  List<CustomShapeDefinition> get all => [...defaults, ...custom];
  void add(CustomShapeDefinition definition) => custom.add(definition);
}

class ShapeSnapAssist {
  static double snapAngle(double radians, {double increment = math.pi / 12}) => (radians / increment).round() * increment;
  static Rect normalizeRect(Offset a, Offset b) => Rect.fromPoints(a, b);
}
''')

          Path('lib/components/shapes/shape_palette_dialog.dart').write_text(r'''import 'package:flutter/material.dart';
import 'package:sadab/components/shapes/custom_shape_engine.dart';

class ShapePaletteDialog extends StatefulWidget {
  const ShapePaletteDialog({super.key, required this.onSelected, this.registry = const CustomShapeRegistry()});
  final ValueChanged<CustomShapeDefinition> onSelected;
  final CustomShapeRegistry registry;

  @override
  State<ShapePaletteDialog> createState() => _ShapePaletteDialogState();
}

class _ShapePaletteDialogState extends State<ShapePaletteDialog> {
  ShapeFill fill = ShapeFill.transparent;
  ShapeStrokeStyle stroke = ShapeStrokeStyle.solid;
  double weight = 3;

  IconData iconFor(ShapeKind kind) => switch (kind) {
    ShapeKind.line => Icons.horizontal_rule,
    ShapeKind.arrow => Icons.arrow_forward,
    ShapeKind.doubleArrow => Icons.swap_horiz,
    ShapeKind.rectangle => Icons.crop_square,
    ShapeKind.roundedRect => Icons.rounded_corner,
    ShapeKind.ellipse => Icons.circle_outlined,
    ShapeKind.axes => Icons.axis_style,
    ShapeKind.triangle => Icons.change_history,
    ShapeKind.star => Icons.star_border,
  };

  @override
  Widget build(BuildContext context) => AlertDialog(
    title: const Text('Shapes'),
    content: SizedBox(width: 420, child: SingleChildScrollView(child: Column(mainAxisSize: MainAxisSize.min, children: [
      GridView.builder(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, crossAxisSpacing: 8, mainAxisSpacing: 8), itemCount: widget.registry.all.length, itemBuilder: (_, i) {
        final shape = widget.registry.all[i];
        return OutlinedButton(onPressed: () => widget.onSelected(shape.copyWith(fill: fill, strokeStyle: stroke, lineWeight: weight)), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(iconFor(shape.kind)), const SizedBox(height: 4), Text(shape.label, textAlign: TextAlign.center, style: const TextStyle(fontSize: 11))]));
      }),
      const SizedBox(height: 14),
      SegmentedButton<ShapeFill>(segments: const [ButtonSegment(value: ShapeFill.transparent, label: Text('Clear')), ButtonSegment(value: ShapeFill.translucent, label: Text('Glass')), ButtonSegment(value: ShapeFill.solid, label: Text('Solid'))], selected: {fill}, onSelectionChanged: (v) => setState(() => fill = v.first)),
      const SizedBox(height: 10),
      SegmentedButton<ShapeStrokeStyle>(segments: const [ButtonSegment(value: ShapeStrokeStyle.solid, label: Text('Solid')), ButtonSegment(value: ShapeStrokeStyle.dotted, label: Text('Dotted')), ButtonSegment(value: ShapeStrokeStyle.dashed, label: Text('Dashed'))], selected: {stroke}, onSelectionChanged: (v) => setState(() => stroke = v.first)),
      Row(children: [const Text('Weight'), Expanded(child: Slider(min: 1, max: 12, divisions: 11, value: weight, label: weight.toStringAsFixed(0), onChanged: (v) => setState(() => weight = v)))])
    ]))),
  );
}

extension on CustomShapeDefinition {
  CustomShapeDefinition copyWith({ShapeFill? fill, ShapeStrokeStyle? strokeStyle, double? lineWeight}) => CustomShapeDefinition(id: id, label: label, kind: kind, fill: fill ?? this.fill, strokeStyle: strokeStyle ?? this.strokeStyle, lineWeight: lineWeight ?? this.lineWeight);
}
''')

          Path('lib/components/toolbar/floating_toolbox.dart').write_text(r'''import 'package:flutter/material.dart';

class FloatingToolbox extends StatefulWidget {
  const FloatingToolbox({super.key, required this.onPenPreset, required this.onEraser, required this.onUndo, required this.onRedo, required this.onPalmRejection, required this.onShapes});
  final ValueChanged<int> onPenPreset;
  final VoidCallback onEraser;
  final VoidCallback onUndo;
  final VoidCallback onRedo;
  final ValueChanged<bool> onPalmRejection;
  final VoidCallback onShapes;

  @override
  State<FloatingToolbox> createState() => _FloatingToolboxState();
}

class _FloatingToolboxState extends State<FloatingToolbox> {
  Offset position = const Offset(24, 180);
  bool palm = true;

  @override
  Widget build(BuildContext context) => LayoutBuilder(builder: (context, constraints) {
    final maxX = (constraints.maxWidth - 320).clamp(8.0, double.infinity);
    final maxY = (constraints.maxHeight - 72).clamp(8.0, double.infinity);
    position = Offset(position.dx.clamp(8.0, maxX), position.dy.clamp(8.0, maxY));
    return Positioned(left: position.dx, top: position.dy, child: GestureDetector(onPanUpdate: (d) => setState(() => position += d.delta), child: Material(elevation: 8, color: Theme.of(context).colorScheme.surface.withValues(alpha: .94), shape: const StadiumBorder(), child: Padding(padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6), child: Row(mainAxisSize: MainAxisSize.min, children: [
      ...[1,2,3].map((i) => _btn('P$i', () => widget.onPenPreset(i))),
      _btn('E', widget.onEraser), _btn('↶', widget.onUndo), _btn('↷', widget.onRedo), _btn('◇', widget.onShapes),
      IconButton(tooltip: 'Palm rejection', isSelected: palm, onPressed: () { setState(() => palm = !palm); widget.onPalmRejection(palm); }, icon: const Icon(Icons.back_hand_outlined)),
    ]))));
  });

  Widget _btn(String label, VoidCallback onPressed) => Padding(padding: const EdgeInsets.symmetric(horizontal: 2), child: IconButton.filledTonal(tooltip: label, onPressed: onPressed, icon: Text(label, style: const TextStyle(fontWeight: FontWeight.w700, fontSize: 12))));
}
''')

          Path('lib/components/toolbar/sadab_top_toolbar.dart').write_text(r'''import 'package:flutter/material.dart';
import 'package:sadab/components/toolbar/toolbar_button.dart';
import 'package:sadab/data/tools/_tool.dart';

class SadabTopToolbar extends StatelessWidget {
  const SadabTopToolbar({super.key, required this.title, required this.leading, required this.currentTool, required this.onPen, required this.onHighlighter, required this.onEraser, required this.onLasso, required this.onShapes, required this.onText, required this.onEInk, required this.onColor, required this.onWidth, required this.trailing});
  final Widget title, leading, trailing;
  final Tool currentTool;
  final VoidCallback onPen, onHighlighter, onEraser, onLasso, onShapes, onText, onEInk;
  final VoidCallback onColor, onWidth;

  @override
  Widget build(BuildContext context) => Material(color: Theme.of(context).colorScheme.surface, child: SafeArea(bottom: false, child: SizedBox(height: 56, child: Row(children: [leading, Expanded(child: SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(children: [title, const SizedBox(width: 8), ToolbarButton(icon: Icons.edit_rounded, tooltip: 'Pen', selected: currentTool.toolId.name.contains('Pen'), onPressed: onPen), ToolbarButton(icon: Icons.highlight_rounded, tooltip: 'Highlighter', onPressed: onHighlighter), ToolbarButton(icon: Icons.auto_fix_off_rounded, tooltip: 'Eraser', onPressed: onEraser), ToolbarButton(icon: Icons.lasso_rounded, tooltip: 'Lasso', onPressed: onLasso), ToolbarButton(icon: Icons.category_outlined, tooltip: 'Shapes', onPressed: onShapes), ToolbarButton(icon: Icons.title_rounded, tooltip: 'Text', onPressed: onText), ToolbarButton(icon: Icons.contrast_rounded, tooltip: 'E-Ink', onPressed: onEInk), ToolbarButton(icon: Icons.palette_outlined, tooltip: 'Color', onPressed: onColor), ToolbarButton(icon: Icons.line_weight_rounded, tooltip: 'Stroke', onPressed: onWidth)]))), trailing])));
}
''')

          # Editor integration is intentionally additive: the existing canvas/stylus pipeline remains unchanged.
          ep = root / 'lib/pages/editor/editor.dart'
          s = ep.read_text().replace('package:saber/', 'package:sadab/')
          if 'sadab/components/toolbar/floating_toolbox.dart' not in s:
              s = s.replace("import 'package:sadab/components/toolbar/toolbar.dart';\n", "import 'package:sadab/components/toolbar/toolbar.dart';\nimport 'package:sadab/components/toolbar/floating_toolbox.dart';\nimport 'package:sadab/components/shapes/shape_palette_dialog.dart';\n", 1)
          helper = '''\n  void showSadabShapes() {\n    showDialog(context: context, builder: (_) => ShapePaletteDialog(onSelected: (_) { currentTool = ShapePen(); setState(() {}); Navigator.of(context).pop(); }));\n  }\n\n  void setSadabPen(int preset) {\n    setState(() { currentTool = switch (preset) { 1 => Pen.fountainPen(), 2 => Pen.ballpointPen(), _ => Pencil.currentPencil }; });\n  }\n'''
          if 'void showSadabShapes()' not in s:
              s = s.replace('  @override\n  Widget build(BuildContext context) {', helper + '\n  @override\n  Widget build(BuildContext context) {', 1)
          s = s.replace("        body: body,\n", "        body: body,\n        floatingActionButton: FloatingToolbox(onPenPreset: setSadabPen, onEraser: () => setState(() => currentTool = Eraser()), onUndo: undo, onRedo: redo, onPalmRejection: (enabled) => setState(() => stows.editorFingerDrawing.value = enabled), onShapes: showSadabShapes),\n", 1) if 'floatingActionButton: FloatingToolbox(' not in s else s
          ep.write_text(s)

          # Brand the visible README title without rewriting URLs or storage/network identifiers.
          rp = root / 'README.md'
          rs = rp.read_text()
          rs = rs.replace(' alt="Logo"> Saber', ' alt="Logo"> Sadab', 1).replace('Saber is the notes app built for handwriting.', 'Sadab is a distraction-free study and handwriting app.', 1)
          rp.write_text(rs)
          PY

          git add -A
          git rm -f .github/workflows/sadab-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sadab): apply study suite"
          git push origin HEAD:feature/sadab-custom-suite
